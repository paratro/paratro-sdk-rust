[package]
name = "paratro-sdk"
version = "1.8.1"
edition = "2021"
# Minimum toolchain verified with `cargo +1.85 check --locked --all-targets`.
# The crate's own code needs far less; the locked dependency tree (reqwest →
# native-tls → getrandom 0.4 / security-framework 3.7, icu 2.x, and a dependency
# on edition 2024) does not build on 1.83 or older.
rust-version = "1.85"
description = "Official Rust SDK for Paratro MPC Wallet Gateway"
license = "MIT"
repository = "https://github.com/paratro/paratro-sdk-rust"
keywords = ["paratro", "mpc", "wallet", "x402", "crypto"]
categories = ["api-bindings", "cryptography"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
dotenvy = "0.15"
